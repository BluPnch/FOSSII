<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 586" role="img" aria-labelledby="title desc">
  <title id="title">Вторая свёртка в клетке (0,0) для фильтра №1</title>
  <desc id="desc">Окно 4 на 4 начинается в верхнем левом углу каждой дополненной карты. Серые клетки в верхней строке и левом столбце содержат нули рамки. Показаны окна и веса для каналов 1, 2 и 16 и общий вклад каналов 3–15. К сумме вкладов 0,0292 прибавляется смещение 0,0400. В левой верхней клетке выходной карты №1 получается 0,0692.</desc>
